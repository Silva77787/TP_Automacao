services:
  - type: web
    name: find-your-movie-api
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r backend/requirements.txt &&
      cd backend &&
      python manage.py collectstatic --noinput
    startCommand: |
      cd backend &&
      gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: movie-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "find-your-movie-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://silva77787.github.io"
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false

databases:
  - name: movie-db
    databaseName: moviedb
    user: movieadmin
    plan: free
